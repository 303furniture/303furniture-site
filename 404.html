<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ページが見つかりません | 303</title>
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.303furniture.net/404.html" />
    
    <!-- SEO対策 -->
    <meta name="description" content="お探しのページが見つかりませんでした。303のホームページにお戻りください。">
    <meta name="robots" content="noindex,nofollow">
    
    <!-- OGP設定 -->
    <meta property="og:title" content="ページが見つかりません | 303">
    <meta property="og:description" content="お探しのページが見つかりませんでした。">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.303furniture.net/404.html">
    <meta property="og:site_name" content="303">
    <meta property="og:locale" content="ja_JP">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Noto Serif JP", serif;
            line-height: 1.8;
            color: #444;
            background-color: #fefefe;
            font-weight: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }
        
        .error-container {
            text-align: center;
            max-width: 600px;
        }
        
        .error-code {
            font-size: 6rem;
            font-weight: 200;
            color: #ccc;
            margin-bottom: 2rem;
        }
        
        .error-title {
            font-size: 2rem;
            font-weight: 400;
            margin-bottom: 1.5rem;
            color: #444;
        }
        
        .error-message {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 3rem;
            line-height: 1.8;
        }
        
        .home-button {
            display: inline-block;
            padding: 1rem 2.5rem;
            background: #444;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 300;
            transition: all 0.3s ease;
            letter-spacing: 0.1em;
        }
        
        .home-button:hover {
            background: #333;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }
        
        .logo {
            margin-top: 3rem;
            opacity: 0.7;
        }
        
        .logo img {
            height: 40px;
            width: auto;
        }
        
        @media (max-width: 768px) {
            .error-code {
                font-size: 4rem;
            }
            
            .error-title {
                font-size: 1.5rem;
            }
            
            .error-message {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <h1 class="error-title">ページが見つかりません</h1>
        <p class="error-message">
            お探しのページは存在しないか、移動または削除された可能性があります。<br>
            ホームページから再度お探しください。
        </p>
        <a href="/" class="home-button">ホームページに戻る</a>
        
        <div class="logo">
            <a href="/">
                <img src="./assets/images/logo.png" alt="303 ロゴ">
            </a>
        </div>
    </div>
</body>
</html>
